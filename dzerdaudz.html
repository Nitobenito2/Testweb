<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <title>Dzer daudz</title>
</head>
<body>
<script>
function maksa(){
	let dz = document.getElementsByTagName('input');
    let sum=0;
    for(i = 0; i < dz.length-1; i++) {  // dz.length-1, lai neiekļautu pogu
       if(dz[i].checked) sum += Number(dz[i].value);
    }
    document.getElementById("maksa").innerHTML = "Jāmaksā " + sum.toFixed(2) + " €";
}   
</script>

<p id="maksa"></p>

<form>
  <input type="checkbox" id="kafija" name="kafija" value="3.60">
  <label for="kafija">kafija</label><br>

  <input type="checkbox" id="sula"  name="sula" value="2.50">
  <label for="sula">sula</label><br>

  <input type="checkbox" id="kakao" name="kakao" value="3.20">
  <label for="kakao">kakao</label><br>

  <!-- CETURTA DZĒRIENA IZVĒLNE -->
  <input type="checkbox" id="teeja" name="teeja" value="2.80">
  <label for="teeja">tēja</label><br><br>

  <input type="button" id="poga" value="Jāmaksā" onclick="maksa()">
</form> 
<a href="index.html">Atpakaļ uz pirmo lapu </a>
</body>
</html>
